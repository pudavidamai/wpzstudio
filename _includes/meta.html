    <meta charset="utf-8" />
    <meta content='text/html; charset=utf-8' http-equiv='Content-Type'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0'>

    {% if page.excerpt %}
    <meta name="description" content="{{ page.excerpt| strip_html }}" />
    <meta property="og:description" content="{{ page.excerpt| strip_html }}" />
    {% else %}
    <meta name="description" content="{{ site.description }}">
    <meta property="og:description" content="{{ site.description }}" />
    {% endif %}
    <meta name="author" content="{{ site.name }}" />

    <!-- Favicon: the WPZ Studio corner mark, same geometry as the app badge. -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/wpz-mark-32.png' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/wpz-mark-16.png' | relative_url }}" />
    <link rel="icon" type="image/svg+xml" href="{{ '/images/wpzstudio-mark.svg' | relative_url }}" />
    <link rel="alternate icon" type="image/x-icon" href="{{ '/images/favicon.ico' | relative_url }}" />
    <link rel="apple-touch-icon" href="{{ '/images/wpz-mark-256.png' | relative_url }}" />

    <!-- Social previews use the same WPZ Studio mark as the site and favicon. -->
    <meta property="og:image" content="{{ '/images/wpz-mark-512.png' | absolute_url }}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="{{ '/images/wpz-mark-512.png' | absolute_url }}" />

    {% if page.title %}
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="twitter:title" content="{{ page.title }}" />
    {% endif %}
