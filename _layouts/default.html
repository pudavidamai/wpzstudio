<!DOCTYPE html>
<html>
  <head>
    <script>
      // Apply the saved theme before CSS loads so switching themes never flashes.
      (function () {
        try {
          var saved = window.localStorage.getItem("wpz-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>
    {% include meta.html %}

    <title>
      {% if page.title %}{{ page.title }} - {% endif %}{{ site.name }}
    </title>

    <link rel="stylesheet" type="text/css" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ '/feed.xml' | relative_url }}" />
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ '/' | relative_url }}" class="site-avatar"><img src="{{ site.avatar | relative_url }}" alt="{{ site.name }} avatar" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ '/' | relative_url }}">{{ site.name }}</a></h1>
            <p class="site-description" data-i18n-global="site.description">{{ site.description }}</p>
          </div>

          <nav>
            <a href="{{ '/' | relative_url }}" data-i18n-global="nav.home">Home</a>
            <a href="{{ '/about/' | relative_url }}" data-i18n-global="nav.about">About</a>
            <span class="lang-switch" aria-label="Language switcher">
              <button type="button" class="lang-switch-btn" data-lang-option="zh">中</button>
              <button type="button" class="lang-switch-btn" data-lang-option="en">EN</button>
            </span>
            <span class="theme-switch" role="group" aria-label="Theme switcher">
              <button type="button" class="theme-switch-btn" data-theme-option="light" aria-label="Light theme" title="Light theme">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="4" />
                  <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
              </button>
              <button type="button" class="theme-switch-btn" data-theme-option="dark" aria-label="Dark theme" title="Dark theme">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z" />
                </svg>
              </button>
            </span>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container {% if page.wide %}container-wide{% endif %}">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}
    <script>
      (function() {
        const storageKey = "wpz-lang";
        const themeStorageKey = "wpz-theme";
        const globalText = {
          zh: {
            "nav.home": "首页",
            "nav.about": "关于",
            "site.description": "欢迎来到 WPZ Studio。我们是一家独立开发工作室，专注打造好用、可靠、学习成本低的软件产品。",
            "theme.light": "浅色主题",
            "theme.dark": "深色主题"
          },
          en: {
            "nav.home": "Home",
            "nav.about": "About",
            "site.description": "Welcome to WPZ Studio, an independent development studio dedicated to crafting engaging and effective desktop applications.",
            "theme.light": "Light theme",
            "theme.dark": "Dark theme"
          }
        };

        function resolveInitialLang() {
          const savedLang = window.localStorage.getItem(storageKey);
          if (savedLang === "zh" || savedLang === "en") {
            return savedLang;
          }

          return navigator.language && navigator.language.toLowerCase().startsWith("zh")
            ? "zh"
            : "en";
        }

        function applyGlobalI18n(lang) {
          const dictionary = globalText[lang] || globalText.en;
          const nodes = document.querySelectorAll("[data-i18n-global]");

          nodes.forEach((node) => {
            const key = node.getAttribute("data-i18n-global");
            if (dictionary[key]) {
              node.textContent = dictionary[key];
            }
          });

          document.querySelectorAll(".theme-switch-btn").forEach((button) => {
            const isLight = button.getAttribute("data-theme-option") === "light";
            const label = dictionary[isLight ? "theme.light" : "theme.dark"];
            button.setAttribute("aria-label", label);
            button.setAttribute("title", label);
          });
        }

        function updateButtons(lang) {
          const buttons = document.querySelectorAll(".lang-switch-btn");
          buttons.forEach((button) => {
            const isActive = button.getAttribute("data-lang-option") === lang;
            button.classList.toggle("is-active", isActive);
            button.setAttribute("aria-pressed", isActive ? "true" : "false");
          });
        }

        function setLang(lang) {
          const nextLang = lang === "zh" ? "zh" : "en";
          window.__wpzLang = nextLang;
          document.documentElement.lang = nextLang === "zh" ? "zh-CN" : "en";
          window.localStorage.setItem(storageKey, nextLang);
          applyGlobalI18n(nextLang);
          updateButtons(nextLang);
          window.dispatchEvent(new CustomEvent("wpz:lang-change", { detail: { lang: nextLang } }));
        }

        function currentTheme() {
          const explicit = document.documentElement.getAttribute("data-theme");
          if (explicit === "light" || explicit === "dark") {
            return explicit;
          }
          return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        function updateThemeButtons(theme) {
          document.querySelectorAll(".theme-switch-btn").forEach((button) => {
            const isActive = button.getAttribute("data-theme-option") === theme;
            button.classList.toggle("is-active", isActive);
            button.setAttribute("aria-pressed", isActive ? "true" : "false");
          });
        }

        // Handle for the pending "transitions back on" frame, so rapid
        // toggling cannot restore transitions before the last paint lands.
        let themeRestoreFrame = 0;

        function setTheme(theme, persist) {
          const nextTheme = theme === "dark" ? "dark" : "light";
          const root = document.documentElement;

          // Clicking the already-active option must not touch the DOM at all.
          if (root.getAttribute("data-theme") === nextTheme) {
            updateThemeButtons(nextTheme);
            return;
          }

          // Changing a root custom property invalidates every element that
          // inherits it. With transitions enabled here, all 73 cards would
          // animate their shadow / border at once and the backdrop-filter
          // layers would re-blur every frame — that is the visible stutter.
          // Freeze transitions for the single frame the palette flips, then
          // let the normal hover transitions resume.
          if (themeRestoreFrame) {
            window.cancelAnimationFrame(themeRestoreFrame);
          }
          root.classList.add("theme-switching");
          root.setAttribute("data-theme", nextTheme);
          if (persist) {
            window.localStorage.setItem(themeStorageKey, nextTheme);
          }
          updateThemeButtons(nextTheme);

          const restoreTransitions = function () {
            themeRestoreFrame = 0;
            root.classList.remove("theme-switching");
          };
          if (window.requestAnimationFrame) {
            themeRestoreFrame = window.requestAnimationFrame(function () {
              themeRestoreFrame = window.requestAnimationFrame(restoreTransitions);
            });
          } else {
            restoreTransitions();
          }

          window.dispatchEvent(new CustomEvent("wpz:theme-change", { detail: { theme: nextTheme } }));
        }

        document.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) {
            return;
          }

          if (target.matches(".lang-switch-btn")) {
            setLang(target.getAttribute("data-lang-option"));
            return;
          }

          if (target.matches(".theme-switch-btn")) {
            setTheme(target.getAttribute("data-theme-option"), true);
          }
        });

        // Only follow live system changes while the visitor has not chosen a theme.
        if (window.matchMedia) {
          const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
          const onSystemThemeChange = () => {
            if (!window.localStorage.getItem(themeStorageKey)) {
              updateThemeButtons(currentTheme());
            }
          };
          if (darkQuery.addEventListener) {
            darkQuery.addEventListener("change", onSystemThemeChange);
          } else if (darkQuery.addListener) {
            darkQuery.addListener(onSystemThemeChange);
          }
        }

        setLang(resolveInitialLang());
        updateThemeButtons(currentTheme());
      })();
    </script>
  </body>
</html>
