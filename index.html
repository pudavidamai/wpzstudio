---
layout: default
title: WPZ Studio 应用列表
wide: true
---

<section class="home-hero">
  <h1 data-i18n-home="hero.title">WPZ Studio 应用列表</h1>
  <p data-i18n-home="hero.subtitle">专注实用工具、学习教育与效率提升，持续发布面向全球用户的桌面应用。</p>
  <div class="hero-stats" id="heroStats" aria-label="统计数据"></div>
</section>

<section class="home-intro" id="zhIntro">
  <p data-i18n-home="intro.lead">欢迎来到 WPZ Studio。我们是一家独立开发工作室，致力于打造好用、可靠、学习成本低的软件产品。</p>
  <p data-i18n-home="intro.detail">你可以在下方查看全部应用，并按分类快速筛选，点击卡片即可前往 Microsoft Store 查看详情。</p>
</section>

<section class="app-toolbar" id="appToolbar" aria-label="应用筛选工具栏">
  <label id="categoryFilterLabel" for="categoryFilter" data-i18n-home="toolbar.category">分类筛选</label>
  <select id="categoryFilter">
    <option value="all">全部分类</option>
  </select>

  <label id="keywordFilterLabel" for="keywordFilter" data-i18n-home="toolbar.keyword">关键词</label>
  <input id="keywordFilter" type="search" placeholder="输入应用名或描述" />

  <label id="sortByLabel" for="sortBy" data-i18n-home="toolbar.sort">排序</label>
  <select id="sortBy">
    <option value="name-asc" data-i18n-home="toolbar.sortAsc">名称 A-Z</option>
    <option value="name-desc" data-i18n-home="toolbar.sortDesc">名称 Z-A</option>
  </select>

  <button id="resetFilter" type="button" data-i18n-home="toolbar.reset">清空筛选</button>
  <span id="appCount" class="app-count">0 款应用</span>
</section>

<section id="appGrid" class="app-grid" aria-live="polite"></section>

<script>
  // Apps catalog is sourced from `_data/wpz_apps.yml` (regenerated by
  // `D:/Projects/wpzstudio-tools/fetch-catalog.mjs`). The YAML gives us the
  // canonical productId; below we re-emit it in the historical inline
  // `{name, category, price, desc, descEn, image, link}` shape so the rest
  // of this file's filter / sort / render code (lines 38+) stays untouched.
  // Free apps (HK$0) are still filtered out by `sanitizeApps()` further down.
  const apps = [
    {%- for app in site.data.wpz_apps -%}
      {
        name: {{ app.name | jsonify }},
        category: {{ app.category | default: '' | jsonify }},
        price: {{ app.price | default: '' | jsonify }},
        desc: {{ app.description | default: '' | jsonify }},
        descEn: {{ app.descriptionEn | default: '' | jsonify }},
        image: {{ app.iconUrl | default: '' | jsonify }},
        link: "https://apps.microsoft.com/detail/{{ app.productId }}"
      }{% unless forloop.last %},{% endunless %}
    {%- endfor -%}
  ];

  const categoryFilter = document.getElementById("categoryFilter");
  const keywordFilter = document.getElementById("keywordFilter");
  const sortBy = document.getElementById("sortBy");
  const resetFilter = document.getElementById("resetFilter");
  const appToolbar = document.getElementById("appToolbar");
  const appGrid = document.getElementById("appGrid");
  const appCount = document.getElementById("appCount");
  let currentLang = window.__wpzLang === "zh" ? "zh" : "en";

  const homeText = {
    zh: {
      hero: {
        title: "WPZ Studio 应用列表",
        subtitle: "专注实用工具、学习教育与效率提升，持续发布面向全球用户的桌面应用。"
      },
      intro: {
        lead: "欢迎来到 WPZ Studio。我们是一家独立开发工作室，致力于打造好用、可靠、学习成本低的软件产品。",
        detail: "你可以在下方查看全部应用，并按分类快速筛选，点击卡片即可前往 Microsoft Store 查看详情。"
      },
      toolbar: {
        category: "分类筛选",
        keyword: "关键词",
        sort: "排序",
        sortAsc: "名称 A-Z",
        sortDesc: "名称 Z-A",
        reset: "清空筛选",
        all: "全部分类",
        searchPlaceholder: "输入应用名或描述",
        countUnit: "款应用",
        ariaLabel: "应用筛选工具栏"
      },
      empty: {
        title: "未找到匹配应用",
        detail: "请尝试更换关键词或分类，或者点击“清空筛选”。"
      },
      card: {
        detail: "查看详情",
        coverAltSuffix: "产品封面"
      }
    },
    en: {
      hero: {
        title: "WPZ Studio App Catalog",
        subtitle: "Focused on productivity, learning, and practical utilities for global desktop users."
      },
      intro: {
        lead: "Welcome to WPZ Studio. We are an independent studio building reliable and easy-to-use software.",
        detail: "Browse all apps below, filter by category, and open each card to view details on Microsoft Store."
      },
      toolbar: {
        category: "Category",
        keyword: "Keyword",
        sort: "Sort",
        sortAsc: "Name A-Z",
        sortDesc: "Name Z-A",
        reset: "Reset",
        all: "All categories",
        searchPlaceholder: "Search by app name or description",
        countUnit: "apps",
        ariaLabel: "App filter toolbar"
      },
      empty: {
        title: "No matched apps",
        detail: "Try another keyword or category, or click Reset."
      },
      card: {
        detail: "View details",
        coverAltSuffix: "app cover"
      }
    }
  };

  const categoryI18n = {
    zh: {
      "高效工作": "高效工作",
      "实用程序与工具": "实用程序与工具",
      "开发人员工具": "开发人员工具",
      "教育": "教育",
      "娱乐": "娱乐",
      "照片与视频": "照片与视频"
    },
    en: {
      "高效工作": "Productivity",
      "实用程序与工具": "Utilities & tools",
      "开发人员工具": "Developer tools",
      "教育": "Education",
      "娱乐": "Entertainment",
      "照片与视频": "Photo & video"
    }
  };

  function getByPath(obj, path) {
    return path.split(".").reduce((acc, key) => {
      if (!acc || typeof acc !== "object") {
        return undefined;
      }
      return acc[key];
    }, obj);
  }

  function t(path) {
    return getByPath(homeText[currentLang], path) || getByPath(homeText.en, path) || path;
  }

  function categoryLabel(category) {
    return categoryI18n[currentLang][category] || category;
  }

  function getAppDescription(app) {
    if (currentLang === "en" && app.descEn) {
      return app.descEn;
    }

    return app.desc;
  }

  function updateStaticText() {
    const nodes = document.querySelectorAll("[data-i18n-home]");
    nodes.forEach((node) => {
      const key = node.getAttribute("data-i18n-home");
      const text = t(key);
      if (text) {
        node.textContent = text;
      }
    });

    keywordFilter.placeholder = t("toolbar.searchPlaceholder");
    appToolbar.setAttribute("aria-label", t("toolbar.ariaLabel"));
  }

  function formatCount(value) {
    const unit = t("toolbar.countUnit");
    return `<strong>${value}</strong> ${unit}`;
  }

  function buildStoreSearchLink(name) {
    return "https://apps.microsoft.com/search?query=" + encodeURIComponent(name + " WPZStudio");
  }

  function buildStoreDetailLink(app) {
    const baseLink = String(app.link || "").trim();
    if (!baseLink) {
      return buildStoreSearchLink(app.name);
    }

    const separator = baseLink.includes("?") ? "&" : "?";
    return baseLink + separator + "hl=zh-CN&gl=CN";
  }

  function buildInitials(name) {
    const compactName = String(name || "").trim();
    const words = compactName.split(/\s+/).filter(Boolean);

    if (words.length >= 2) {
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    return compactName.slice(0, 2).toUpperCase();
  }

  function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

  function escapeSvgText(value) {
    return escapeHtml(value);
  }

    // Tiny markdown → HTML for app descriptions. Handles only what
    // Microsoft's DisplayCatalog descriptions actually contain:
    //   - **bold** / *italic*
    //   - # / ## / ### headings (alone or preceding a list)
    //   - - / * unordered list items
    //   - blank-line paragraph breaks
    // Everything else (emoji, CJK punctuation, URLs) is passed through.
    function renderMarkdown(input) {
      const raw = String(input || "").trim();
      if (!raw) return "";
      // Escape HTML up front — we re-introduce only our own tags below.
      let html = escapeHtml(raw);

      // Split on blank lines → blocks. Each block is either a heading,
      // a list, or a paragraph.
      const blocks = html.split(/\n\s*\n/);
      const rendered = blocks.map((block) => {
        const lines = block.split("\n").filter((l) => l.trim() !== "");
        if (lines.length === 0) return "";
        const firstLine = lines[0].trim();

        // Heading: # / ## / ### (the whole block is the heading when
        // it's a single line; when followed by list items we still
        // treat the heading as a separate block).
        const heading = firstLine.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length + 2; // map to <h4>/<h5>/<h6>
          const headingHtml = `<h${level}>${inlineFormat(heading[2])}</h${level}>`;
          const rest = lines.slice(1);
          if (rest.length === 0) return headingHtml;
          // The remaining lines of this block form a sub-block.
          const restBlock = rest.join("\n");
          return headingHtml + renderMarkdown(restBlock);
        }

        // Unordered list: every line starts with - or *
        const isList = lines.every((l) => /^\s*[-*]\s+/.test(l));
        if (isList) {
          const items = lines
            .map((l) => `<li>${inlineFormat(l.replace(/^\s*[-*]\s+/, ""))}</li>`)
            .join("");
          return `<ul>${items}</ul>`;
        }

        // Paragraph: join lines with single space, then inline-format.
        return `<p>${inlineFormat(lines.join(" "))}</p>`;
      });
      return rendered.filter(Boolean).join("");
    }

    function inlineFormat(text) {
      let t = text;
      // **bold** first so *italic* doesn't consume it.
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      // *italic* — match a single * not preceded/followed by another *.
      t = t.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g, "$1<em>$2</em>");
      // Plain URLs → <a>
      t = t.replace(
        /(https?:\/\/[^\s<]+)/g,
        (m) => `<a href="${m}" target="_blank" rel="noopener noreferrer">${m}</a>`
      );
      return t;
    }

    // Truncate a markdown-rendered HTML string to roughly N visible chars,
        // measured by CJK + non-space Latin density (since a "char" in HTML
        // is weighted differently for Chinese vs Latin text). The limit
        // is anchored at paragraph / list-item boundaries so we never cut
        // a tag or mid-sentence.
        function truncateHtml(html, maxVisibleChars) {
          if (!html) return "";

          const tagRegex = /<(p|ul|h[4-6])[\s>][^]*?<\/\1>/g;
          const blocks = [];
          let m;
          while ((m = tagRegex.exec(html)) !== null) {
            const visibleText = m[0].replace(/<[^>]+>/g, "");
            blocks.push({ html: m[0], weight: visibleTextWeight(visibleText) });
          }
          if (blocks.length === 0) return html;

          // Special case: any single block over the limit gets hard-truncated
          // at a sentence boundary. This catches both "one big paragraph"
          // AND "first paragraph too long, rest would also be too long" cases.
          if (blocks[0].weight > maxVisibleChars) {
            return truncateSingleParagraph(blocks[0].html, maxVisibleChars);
          }

          // Normal case: walk top-level blocks (paragraph / list / heading)
          // and accumulate until we exceed the limit. Cap at 3 blocks so
          // the preview never balloons, and force-include the second block
          // when the first was a tiny "📖 应用简介" header.
          let combined = "";
          let totalWeight = 0;
          const maxBlocks = 3;
          for (let i = 0; i < blocks.length && i < maxBlocks; i++) {
            if (combined && totalWeight + blocks[i].weight > maxVisibleChars) break;
            combined += blocks[i].html;
            totalWeight += blocks[i].weight;
          }
          if (combined.length > 0 && totalWeight < maxVisibleChars * 0.4 && blocks.length > 1) {
            const next = blocks[Math.min(1, blocks.length - 1)];
            combined += next.html;
            totalWeight += next.weight;
          }
          return combined;
        }

    // Split one <p>...</p> at the sentence boundary closest to
    // maxVisibleChars visible chars. Falls back to a hard cut at a
    // word/character boundary if no good sentence break exists.
    function truncateSingleParagraph(html, maxVisibleChars) {
      // Find the opening tag and closing </p>.
      const openMatch = html.match(/^<p[^>]*>/);
      const openTag = openMatch ? openMatch[0] : "<p>";
      const bodyStart = openTag.length;
      const closeIdx = html.lastIndexOf("</p>");
      if (closeIdx <= bodyStart) return html;
      const body = html.slice(bodyStart, closeIdx);

      // Walk visible chars and stop at the nearest sentence end
      // (. ! ? 。 ！ ？ ; ; followed by whitespace) at or before the
      // limit. Avoid splitting inside an inline tag.
      let visibleCount = 0;
      let lastBoundary = -1;
      let inTag = false;
      for (let i = 0; i < body.length; i++) {
        const c = body[i];
        if (c === "<") inTag = true;
        else if (c === ">") inTag = false;
        if (!inTag) {
          const isCJK = /[\u4e00-\u9fff]/.test(c);
          const isLatin = /[A-Za-z0-9]/.test(c);
          if (isCJK || isLatin) {
            visibleCount += 1;
            if (/[.!?;:。！？；]\s*$/.test(body.slice(Math.max(0, i - 3), i + 1)) &&
                visibleCount >= maxVisibleChars * 0.7) {
              lastBoundary = i + 1;
            }
            if (visibleCount > maxVisibleChars) {
              if (lastBoundary > 0) break;
              // No sentence boundary found — fall through to hard cut.
              break;
            }
        }
        }
      }

      let cutAt;
      if (lastBoundary > 0 && lastBoundary < body.length) {
        cutAt = lastBoundary;
      } else {
        // Hard cut at the first whitespace after the limit so we don't
        // chop a word in half.
        const hardCut = body.indexOf(" ", bodyStart + maxVisibleChars);
        cutAt = hardCut > 0 ? hardCut : body.length;
      }
      return openTag + body.slice(0, cutAt) + "…</p>";
    }

    // Approximate visual weight of a string: count CJK characters as 1
    // each (they take ~1em in width), and Latin runs as 1 per
    // visible character (so "Hello, world." weights ~13, matching
    // its rendered width). Whitespace-only and pure-punctuation
    // strings weight ~0.
    function visibleTextWeight(text) {
      const t = String(text || "");
      const cjk = (t.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g) || []).length;
      // For Latin text, weight per non-space character (so "Hello, world." = 12)
      const latinNonSpace = (t.replace(/[\u4e00-\u9fff\u3400-\u4dbf\s]/g, "").match(/\S/g) || []).length;
      return cjk + latinNonSpace;
    }

  function buildPalette(name) {
    const palettes = [
      ["#1d4ed8", "#0ea5e9"],
      ["#0f766e", "#14b8a6"],
      ["#7c3aed", "#ec4899"],
      ["#b45309", "#f59e0b"],
      ["#be123c", "#fb7185"],
      ["#4338ca", "#22c55e"]
    ];

    const normalized = normalizeName(name);
    let hash = 0;

    for (let index = 0; index < normalized.length; index += 1) {
      hash = normalized.charCodeAt(index) + ((hash << 5) - hash);
    }

    return palettes[Math.abs(hash) % palettes.length];
  }

  function buildCoverImage(app) {
    const palette = buildPalette(app.name);
    const name = escapeSvgText(app.name);
    const category = escapeSvgText(categoryLabel(app.category));
    const initials = escapeSvgText(buildInitials(app.name));
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="${name}">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="${palette[0]}"/>
            <stop offset="100%" stop-color="${palette[1]}"/>
          </linearGradient>
        </defs>
        <rect width="640" height="360" rx="28" fill="url(#g)"/>
        <circle cx="540" cy="78" r="88" fill="rgba(255,255,255,0.12)"/>
        <circle cx="112" cy="310" r="120" fill="rgba(255,255,255,0.08)"/>
        <rect x="34" y="30" rx="18" ry="18" width="146" height="42" fill="rgba(255,255,255,0.16)"/>
        <text x="52" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#ffffff">${category}</text>
        <text x="42" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="118" font-weight="700" letter-spacing="4" fill="#ffffff">${initials}</text>
        <text x="42" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#ffffff">${name}</text>
      </svg>
    `.trim();

    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
  }

  function normalizeName(name) {
    return String(name || "").trim().toLowerCase();
  }

  function isFreePrice(price) {
    const text = String(price || "").trim().toLowerCase();

    return text.includes("免费")
      || text.includes("free")
      || /^hk\$\s*0+(\.0+)?$/.test(text)
      || /^\$\s*0+(\.0+)?$/.test(text)
      || /^0+(\.0+)?$/.test(text);
  }

  function isMobileViewport() {
    return typeof window !== "undefined" && window.matchMedia
      ? window.matchMedia("(max-width: 700px)").matches
      : false;
  }

  function renderAppDescription(app) {
    const full = renderMarkdown(getAppDescription(app));
    if (!full) return "";
    // Visible character limits per breakpoint:
    //   - desktop: ≈ 90 visible chars (CJK or Latin)
    //   - mobile:  ≈ 60 visible chars
    // These keep every card roughly the same height regardless of
    // whether the description is Chinese (~80 chars/paragraph) or
    // English (~30 words/paragraph).
    const isMobile = isMobileViewport();
    const limit = isMobile ? 60 : 90;
    const fullWeight = visibleTextWeight(full.replace(/<[^>]+>/g, ""));
    if (fullWeight <= limit) return full;
    const truncated = truncateHtml(full, limit);
    return `
      <div class="app-desc-wrap" data-collapsed="true">
        <div class="app-desc app-desc-truncated">${truncated}</div>
        <div class="app-desc app-desc-full" hidden>${full}</div>
        <button type="button" class="app-desc-toggle" data-i18n-card="desc.expand">${currentLang === "en" ? "Show more" : "展开全部 ↓"}</button>
      </div>
    `;
  }

  function attachDescToggle(cardEl) {
    const wrap = cardEl.querySelector(".app-desc-wrap");
    if (!wrap) return;
    const btn = wrap.querySelector(".app-desc-toggle");
    const collapsed = wrap.querySelector(".app-desc-truncated");
    const full = wrap.querySelector(".app-desc-full");
    if (!btn || !collapsed || !full) return;
    btn.addEventListener("click", (event) => {
      event.preventDefault();
      const isCollapsed = wrap.getAttribute("data-collapsed") === "true";
      wrap.setAttribute("data-collapsed", isCollapsed ? "false" : "true");
      collapsed.hidden = isCollapsed;
      full.hidden = !isCollapsed;
      btn.textContent = isCollapsed
        ? (currentLang === "en" ? "Show less ↑" : "收起 ↑")
        : (currentLang === "en" ? "Show more" : "展开全部 ↓");
    });
  }

  function renderHeroStats() {
    const statsEl = document.getElementById("heroStats");
    if (!statsEl) return;
    const categorySet = new Set(visibleApps.map((a) => a.category).filter(Boolean));
    const labels = currentLang === "en"
      ? { apps: "apps", categories: "categories" }
      : { apps: "款应用", categories: "个分类" };
    statsEl.innerHTML = `
      <span class="hero-stat-chip"><strong>${visibleApps.length}</strong>${labels.apps}</span>
      <span class="hero-stat-chip"><strong>${categorySet.size}</strong>${labels.categories}</span>
    `;
  }

  function sanitizeApps(appList) {
    const seenNames = new Set();
    const result = [];

    appList.forEach((app) => {
      if (isFreePrice(app.price)) {
        return;
      }

      const key = normalizeName(app.name);
      if (!key || seenNames.has(key)) {
        return;
      }

      seenNames.add(key);
      result.push({
        ...app,
        image: String(app.image || "").trim(),
        link: buildStoreDetailLink(app)
      });
    });

    return result;
  }

  const visibleApps = sanitizeApps(apps);

  const categories = [...new Set(visibleApps.map((app) => app.category))].sort();

  function renderCategoryOptions() {
    const selectedValue = categoryFilter.value || "all";

    categoryFilter.innerHTML = "";

    const allOption = document.createElement("option");
    allOption.value = "all";
    allOption.textContent = t("toolbar.all");
    categoryFilter.appendChild(allOption);

    categories.forEach((category) => {
      const option = document.createElement("option");
      option.value = category;
      option.textContent = categoryLabel(category);
      categoryFilter.appendChild(option);
    });

    categoryFilter.value = categories.includes(selectedValue) ? selectedValue : "all";
  }

  function sortApps(appList, sortType) {
    const nextList = [...appList];

    nextList.sort((a, b) => {
      const left = a.name.toLowerCase();
      const right = b.name.toLowerCase();

      if (sortType === "name-desc") {
        return right.localeCompare(left);
      }

      return left.localeCompare(right);
    });

    return nextList;
  }

  function renderApps() {
    const selectedCategory = categoryFilter.value;
    const keyword = keywordFilter.value.trim().toLowerCase();
    const sortType = sortBy.value;

    const filteredByCategory = selectedCategory === "all"
      ? visibleApps
      : visibleApps.filter((app) => app.category === selectedCategory);

    const filteredApps = keyword.length === 0
      ? filteredByCategory
      : filteredByCategory.filter((app) => {
        const searchableText = [app.name, app.desc, app.descEn, categoryLabel(app.category)].join(" ").toLowerCase();
        return searchableText.includes(keyword);
      });

    const sortedApps = sortApps(filteredApps, sortType);

    appCount.innerHTML = formatCount(sortedApps.length);

    if (sortedApps.length === 0) {
      appGrid.innerHTML = `
        <article class="app-empty">
          <h3>${t("empty.title")}</h3>
          <p>${t("empty.detail")}</p>
        </article>
      `;
      return;
    }

    appGrid.innerHTML = sortedApps
      .map((app) => {
        const fallbackCover = buildCoverImage(app);
        const primaryCover = app.image || fallbackCover;
        const free = isFreePrice(app.price);
        const descHtml = renderAppDescription(app);

        return `
          <article class="app-card">
            <a class="app-cover" href="${app.link}" target="_blank" rel="noopener noreferrer">
              <img class="app-cover-image" src="${primaryCover}" data-fallback="${fallbackCover}" alt="${escapeHtml(app.name)} ${t("card.coverAltSuffix")}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src=this.dataset.fallback;" />
              <div class="app-cover-overlay">
                <span class="app-cover-cta">${t("card.detail")}</span>
              </div>
            </a>
            <div class="app-card-header">
              <h3><a class="app-title-link" href="${app.link}" target="_blank" rel="noopener noreferrer">${escapeHtml(app.name)}</a></h3>
              <span class="app-category-badge">${escapeHtml(categoryLabel(app.category))}</span>
            </div>
            <div class="app-meta-row">
              <p class="app-price ${free ? "is-free" : ""}">${escapeHtml(free ? (currentLang === "en" ? "Free" : "免费") : app.price)}</p>
              <span class="app-rating" aria-hidden="true">★ ★ ★ ★ ☆</span>
            </div>
            ${descHtml}
            <div class="app-card-footer">
              <a class="app-cta" href="${app.link}" target="_blank" rel="noopener noreferrer">${t("card.detail")}</a>
              <span class="app-productid">${escapeHtml(app.productId || "")}</span>
            </div>
          </article>
        `;
      })
      .join("");

    // Wire description expand/collapse buttons after render.
    appGrid.querySelectorAll(".app-card").forEach(attachDescToggle);
  }

  function applyHomeLanguage(lang) {
    currentLang = lang === "zh" ? "zh" : "en";
    updateStaticText();
    renderCategoryOptions();
    renderHeroStats();
    renderApps();
  }

  categoryFilter.addEventListener("change", renderApps);
  keywordFilter.addEventListener("input", renderApps);
  sortBy.addEventListener("change", renderApps);

  resetFilter.addEventListener("click", () => {
    categoryFilter.value = "all";
    keywordFilter.value = "";
    sortBy.value = "name-asc";
    renderApps();
  });

  window.addEventListener("wpz:lang-change", (event) => {
    const lang = event && event.detail ? event.detail.lang : "en";
    applyHomeLanguage(lang);
  });

  applyHomeLanguage(currentLang);
</script>
