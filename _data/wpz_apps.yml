- productId: "9MTPWC2WVH8R"
  slug: "iis-log-analyzer"
  name: "IIS Log Analyzer"
  title: "IIS Log Analyzer"
  category: "实用程序与工具"
  price: "HK$21.00"
  description: |
    **IIS Log Analyzer** 是一款专为网站管理员、系统运维人员和安全专家设计的专业 IIS 日志分析工具。通过强大的可视化分析和智能威胁检测功能，帮助您深入了解网站性能、用户行为和安全状况。
    
    ## 🎨 核心功能特性
    
    ### 📈 **实时统计分析**
    - **总请求数统计** - 实时监控网站访问量
    - **独立IP分析** - 识别真实用户和访问模式
    - **流量分布图表** - 可视化展示流量趋势
    - **状态码分析** - 快速定位错误和异常
    
    ### ⚡ **性能监控与优化**
    - **响应时间分析** - 平均、中位数、95%响应时间
    - **慢请求识别** - 自动标记性能瓶颈
    - **错误率监控** - 实时跟踪4xx/5xx错误
    - **性能建议** - 智能生成优化建议
    
    ### 🔍 **IP地址深度分析**
    - **访问行为分析** - 每个IP的详细访问模式
    - **风险评分系统** - 智能评估IP风险等级
    - **异常标记** - 自动识别高频访问、多UA等异常
    - **24小时趋势** - 可视化访问时间分布
    
    ### 🌐 **流量来源分析**
    - **来源分类** - 搜索引擎、社交媒体、直接访问
    - **质量评估** - 跳出率、停留时间、转化率分析
    - **ROI分析** - 不同来源的价值评估
    - **优化建议** - 流量获取策略建议
    
    ### 🤖 **User-Agent智能检测**
    - **爬虫识别** - 自动区分正常用户和爬虫
    - **异常检测** - 识别可疑和恶意User-Agent
    - **风险评级** - 四级风险评估体系
    - **自定义规则** - 支持白名单和黑名单配置
    
    ### 🛡️ **安全威胁检测**
