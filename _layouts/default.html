<!DOCTYPE html>
<html>
  <head>
    {% include meta.html %}

    <title>
      {% if page.title %}{{ page.title }} - {% endif %}{{ site.name }}
    </title>

    <link rel="stylesheet" type="text/css" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
    <!-- dark-light-theme: synchronous boot in <head>, before <body> paints (no FOUC). -->
    <script src="{{ '/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ '/feed.xml' | relative_url }}" />
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ '/' | relative_url }}" class="site-avatar"><img src="{{ site.avatar | relative_url }}" alt="{{ site.name }} avatar" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ '/' | relative_url }}">{{ site.name }}</a></h1>
            <p class="site-description" data-i18n-global="site.description">{{ site.description }}</p>
          </div>

          <nav>
            <a href="{{ '/' | relative_url }}" data-i18n-global="nav.home">Home</a>
            <a href="{{ '/about/' | relative_url }}" data-i18n-global="nav.about">About</a>
            <select id="langSelect" class="lang-select" aria-label="Language">
              <option value="zh">中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="de">Deutsch</option>
              <option value="fr">Français</option>
            </select>
            <button type="button" class="theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme" aria-pressed="false">
              <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z" />
              </svg>
              <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
            </button>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container {% if page.wide %}container-wide{% endif %}">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}
    <script>
      (function() {
        const storageKey = "wpz-lang";
        // The six supported UI languages. Order here is the dropdown order.
        const SUPPORTED_LANGS = ["zh", "en", "ja", "ko", "de", "fr"];
        const globalText = {
          zh: {
            "nav.home": "首页",
            "nav.about": "关于",
            "site.description": "欢迎来到 WPZ Studio。我们是一家独立开发工作室，专注打造好用、可靠、学习成本低的软件产品。",
            "page.indexTitle": "WPZ Studio 应用列表"
          },
          en: {
            "nav.home": "Home",
            "nav.about": "About",
            "site.description": "Welcome to WPZ Studio, an independent development studio dedicated to crafting engaging and effective desktop applications.",
            "page.indexTitle": "WPZ Studio App Catalog"
          },
          ja: {
            "nav.home": "ホーム",
            "nav.about": "紹介",
            "site.description": "WPZ Studio へようこそ。私たちは、使いやすく信頼できるソフトウェアを開発する独立スタジオです。",
            "page.indexTitle": "WPZ Studio アプリ一覧"
          },
          ko: {
            "nav.home": "홈",
            "nav.about": "정보",
            "site.description": "WPZ Studio에 오신 것을 환영합니다. 우리는 사용하기 쉽고 신뢰할 수 있는 소프트웨어를 만드는 독립 스튜디오입니다.",
            "page.indexTitle": "WPZ Studio 앱 목록"
          },
          de: {
            "nav.home": "Start",
            "nav.about": "Über",
            "site.description": "Willkommen bei WPZ Studio, einem unabhängigen Entwicklerstudio für zuverlässige und benutzerfreundliche Desktop-Anwendungen.",
            "page.indexTitle": "WPZ Studio App-Übersicht"
          },
          fr: {
            "nav.home": "Accueil",
            "nav.about": "À propos",
            "site.description": "Bienvenue chez WPZ Studio, un studio de développement indépendant dédié à la création d'applications de bureau attrayantes et efficaces.",
            "page.indexTitle": "Catalogue d'applications WPZ Studio"
          }
        };

        function isHomePage() {
          const p = window.location.pathname;
          return p === "/" || p === "" || p === "/index.html" || p.endsWith("/index.html");
        }

        // Pick the language to boot with: an explicit saved choice wins, then we
        // match the browser/OS primary language, and finally fall back to English
        // when nothing we support is detected.
        function resolveInitialLang() {
          const savedLang = window.localStorage.getItem(storageKey);
          if (SUPPORTED_LANGS.includes(savedLang)) {
            return savedLang;
          }

          const navLang = navigator.language ? navigator.language.toLowerCase() : "";
          const primary = navLang.split("-")[0];
          if (SUPPORTED_LANGS.includes(primary)) {
            return primary;
          }

          return "en";
        }

        function applyGlobalI18n(lang) {
          const dictionary = globalText[lang] || globalText.en;
          const nodes = document.querySelectorAll("[data-i18n-global]");

          nodes.forEach((node) => {
            const key = node.getAttribute("data-i18n-global");
            if (dictionary[key]) {
              node.textContent = dictionary[key];
            }
          });
        }

        function langAttrFor(lang) {
          if (lang === "zh") return "zh-CN";
          if (lang === "ja") return "ja";
          if (lang === "ko") return "ko";
          if (lang === "de") return "de";
          if (lang === "fr") return "fr";
          return "en";
        }

        function setLang(lang) {
          const nextLang = SUPPORTED_LANGS.includes(lang) ? lang : "en";
          window.__wpzLang = nextLang;
          document.documentElement.lang = langAttrFor(nextLang);
          window.localStorage.setItem(storageKey, nextLang);
          applyGlobalI18n(nextLang);

          const langSelect = document.getElementById("langSelect");
          if (langSelect) {
            langSelect.value = nextLang;
          }

          if (isHomePage()) {
            const dict = globalText[nextLang] || globalText.en;
            document.title = (dict["page.indexTitle"] || "WPZ Studio") + " - WPZ Studio";
          }

          window.dispatchEvent(new CustomEvent("wpz:lang-change", { detail: { lang: nextLang } }));
        }

        const langSelect = document.getElementById("langSelect");
        if (langSelect) {
          langSelect.addEventListener("change", (event) => {
            setLang(event.target.value);
          });
        }

        setLang(resolveInitialLang());
      })();
    </script>
  </body>
</html>
